<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YILAN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #0a0a0f;
    --green: #39ff14;
    --red: #ff3c5a;
    --dim: #1a2a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    font-family: 'Press Start 2P', monospace;
    color: var(--green);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px 16px;
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 50;
  }

  /* HUD */
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    text-shadow: 0 0 8px var(--green);
    padding: 0 4px;
    flex-shrink: 0;
  }
  .hud-item span { display: block; font-size: 6px; color: #2a4a2a; margin-bottom: 3px; }

  /* Canvas wrapper */
  .canvas-wrap {
    position: relative;
    border: 2px solid var(--green);
    box-shadow: 0 0 16px var(--green), 0 0 40px rgba(57,255,20,0.15);
    flex-shrink: 0;
  }

  canvas { display: block; }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }

  .ov-title {
    font-size: 20px;
    text-shadow: 0 0 14px currentColor, 0 0 36px currentColor;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  @keyframes pulse { from{opacity:.6} to{opacity:1} }

  .ov-sub { font-size: 7px; color: #3a5a3a; text-align: center; line-height: 2.2; }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    padding: 14px 28px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    cursor: pointer;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 14px rgba(57,255,20,0.3);
    letter-spacing: 2px;
    touch-action: manipulation;
  }

  /* D-Pad */
  .dpad {
    position: relative;
    width: 160px;
    height: 160px;
    flex-shrink: 0;
    user-select: none;
  }

  .dpad-btn {
    position: absolute;
    width: 52px;
    height: 52px;
    background: rgba(57,255,20,0.07);
    border: 2px solid rgba(57,255,20,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: rgba(57,255,20,0.22);
    border-color: var(--green);
    box-shadow: 0 0 10px rgba(57,255,20,0.4);
  }

  /* positions: up, down, left, right, center */
  .dpad-up    { top: 0;   left: 54px; border-radius: 8px 8px 0 0; }
  .dpad-down  { bottom: 0; left: 54px; border-radius: 0 0 8px 8px; }
  .dpad-left  { top: 54px; left: 0;   border-radius: 8px 0 0 8px; }
  .dpad-right { top: 54px; right: 0;  border-radius: 0 8px 8px 0; }
  .dpad-center {
    top: 54px; left: 54px;
    background: rgba(57,255,20,0.04);
    border-color: rgba(57,255,20,0.15);
    font-size: 8px;
    color: #2a4a2a;
    text-shadow: none;
  }

  .score-pop {
    position: absolute;
    font-size: 9px;
    color: var(--red);
    text-shadow: 0 0 8px var(--red);
    pointer-events: none;
    animation: scorePop 0.8s forwards;
    z-index: 20;
    white-space: nowrap;
  }
  @keyframes scorePop {
    0%   { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-36px) scale(1.4); }
  }
</style>
</head>
<body>

<!-- HUD -->
<div class="hud">
  <div class="hud-item"><span>SKOR</span><span id="score">0</span></div>
  <div class="hud-item" style="text-align:center"><span>SEVİYE</span><span id="level">1</span></div>
  <div class="hud-item" style="text-align:right"><span>REKOR</span><span id="highscore">0</span></div>
</div>

<!-- Canvas -->
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gameCanvas"></canvas>

  <div class="overlay" id="startOverlay">
    <div class="ov-title" style="color:var(--green)">🐍 YILAN</div>
    <div class="ov-sub">Aşağıdaki tuşlarla yönet<br>Elmayı topla, duvara çarpma!</div>
    <button class="btn" id="startBtn">BAŞLA</button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="ov-title" style="color:var(--red)">BİTTİ!</div>
    <div class="ov-sub" id="finalScore"></div>
    <button class="btn" id="restartBtn" style="border-color:var(--red);color:var(--red);text-shadow:0 0 8px var(--red);box-shadow:0 0 14px rgba(255,60,90,0.3)">TEKRAR</button>
  </div>
</div>

<!-- D-Pad -->
<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up"    id="btn-up">▲</div>
  <div class="dpad-btn dpad-left"  id="btn-left">◀</div>
  <div class="dpad-btn dpad-center">✦</div>
  <div class="dpad-btn dpad-right" id="btn-right">▶</div>
  <div class="dpad-btn dpad-down"  id="btn-down">▼</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas size
function calcSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  // Estimate space used by HUD (~40px), dpad (~160px), padding (~56px)
  const maxH = vh - 40 - 160 - 56 - 24;
  const maxW = vw - 24;
  const raw = Math.min(maxW, maxH);
  // Round to nearest multiple of 20
  return Math.floor(raw / 20) * 20;
}

let SIZE = calcSize();
canvas.width = SIZE;
canvas.height = SIZE;
const TILE = 20;
let COLS = SIZE / TILE;
let ROWS = SIZE / TILE;

let snake, dir, nextDir, food, score, highscore, level, speed, gameLoop, running, paused;

function init() {
  snake = [{x:Math.floor(COLS/2), y:Math.floor(ROWS/2)},
           {x:Math.floor(COLS/2)-1, y:Math.floor(ROWS/2)},
           {x:Math.floor(COLS/2)-2, y:Math.floor(ROWS/2)}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0; level = 1; speed = 180;
  running = true; paused = false;
  spawnFood();
  updateHUD();
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food = pos; food.pulse = 0;
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('highscore').textContent = highscore||0;
}

function step() {
  if (!running || paused) return;
  dir = {...nextDir};
  const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return gameOver();
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver();
  snake.unshift(head);
  if (head.x===food.x&&head.y===food.y) {
    score += 10*level;
    if (score>(highscore||0)) { highscore=score; localStorage.setItem('snakeHS',highscore); }
    level = Math.floor(score/100)+1;
    speed = Math.max(70, 180-(level-1)*12);
    spawnFood();
    showScorePop(head);
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speed);
  } else {
    snake.pop();
  }
  updateHUD();
  draw();
}

function showScorePop(pos) {
  const wrap = document.getElementById('canvasWrap');
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = '+' + (10*level);
  el.style.left = (pos.x*TILE + TILE/2 - 16) + 'px';
  el.style.top  = (pos.y*TILE - 4) + 'px';
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // grid dots
  ctx.fillStyle = '#0d180d';
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++)
    ctx.fillRect(x*TILE+TILE/2-1, y*TILE+TILE/2-1, 2, 2);

  // food (guard: only draw if game has started)
  if (!food) return;
  food.pulse = (food.pulse+0.09)%(Math.PI*2);
  const fp = Math.sin(food.pulse)*0.2+0.8;
  const fx = food.x*TILE+TILE/2, fy = food.y*TILE+TILE/2, fr = (TILE/2-3)*fp;
  ctx.save();
  ctx.shadowColor='#ff3c5a'; ctx.shadowBlur=14*fp;
  ctx.fillStyle='#ff3c5a';
  ctx.beginPath();
  ctx.moveTo(fx,fy-fr); ctx.lineTo(fx+fr,fy); ctx.lineTo(fx,fy+fr); ctx.lineTo(fx-fr,fy);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // snake
  snake.forEach((seg,i) => {
    const ratio = i/snake.length;
    const x=seg.x*TILE, y=seg.y*TILE;
    const pad = i===0?1:2, size=TILE-pad*2;
    if (i===0) {
      ctx.save(); ctx.shadowColor='#39ff14'; ctx.shadowBlur=10;
      ctx.fillStyle='#39ff14'; ctx.fillRect(x+pad,y+pad,size,size); ctx.restore();
      // eyes
      ctx.fillStyle='#0a0a0f';
      const {x:ex,y:ey}=dir;
      if(ex===1){ctx.fillRect(x+12,y+4,3,3);ctx.fillRect(x+12,y+12,3,3);}
      else if(ex===-1){ctx.fillRect(x+4,y+4,3,3);ctx.fillRect(x+4,y+12,3,3);}
      else if(ey===-1){ctx.fillRect(x+4,y+4,3,3);ctx.fillRect(x+12,y+4,3,3);}
      else{ctx.fillRect(x+4,y+12,3,3);ctx.fillRect(x+12,y+12,3,3);}
    } else {
      const g = Math.floor(255*(1-ratio*0.7));
      ctx.fillStyle=`rgb(${Math.floor(g*0.22)},${Math.floor(g*0.55)},${Math.floor(g*0.04)})`;
      ctx.fillRect(x+pad,y+pad,size,size);
    }
  });
}

function gameOver() {
  running=false; clearInterval(gameLoop);
  let f=0;
  const flash=setInterval(()=>{
    ctx.fillStyle=`rgba(255,60,90,${0.25-f*0.04})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(++f>5){
      clearInterval(flash);
      document.getElementById('finalScore').textContent='SKOR: '+score+'  •  SEVİYE: '+level;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }
  },80);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (!running) return;
  const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},
             ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
             ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},
             ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
  const nd=map[e.key];
  if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y)){nextDir=nd; e.preventDefault();}
});

// D-Pad buttons
function addDirBtn(id, dx, dy) {
  const el = document.getElementById(id);
  function activate(e) {
    e.preventDefault();
    if(!running) return;
    const nd={x:dx,y:dy};
    if(!(nd.x===-dir.x&&nd.y===-dir.y)) nextDir=nd;
    el.classList.add('active');
  }
  function deactivate() { el.classList.remove('active'); }
  el.addEventListener('touchstart', activate, {passive:false});
  el.addEventListener('touchend', deactivate, {passive:true});
  el.addEventListener('mousedown', activate);
  el.addEventListener('mouseup', deactivate);
}
addDirBtn('btn-up',    0,-1);
addDirBtn('btn-down',  0, 1);
addDirBtn('btn-left', -1, 0);
addDirBtn('btn-right', 1, 0);

// Swipe on canvas
let swipeStart = null;
canvas.addEventListener('touchstart', e => {
  swipeStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!swipeStart || !running) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // too short
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) {
    nd = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  } else {
    nd = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  }
  if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
}, {passive: true});

// Buttons
document.getElementById('startBtn').addEventListener('click', () => {
  highscore = parseInt(localStorage.getItem('snakeHS')||'0');
  document.getElementById('startOverlay').classList.add('hidden');
  init(); draw();
  gameLoop = setInterval(step, speed);
});
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOverOverlay').classList.add('hidden');
  init(); draw();
  gameLoop = setInterval(step, speed);
});

// Initial
draw();
</script>
</body>
</html>
