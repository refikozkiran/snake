<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YILAN / SNAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg: #0a0a0f;
    --green: #39ff14;
    --red: #ff3c5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    font-family: 'Press Start 2P', monospace;
    color: var(--green);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 12px;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none;
    z-index: 50;
  }

  /* HUD */
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    text-shadow: 0 0 10px var(--green), 0 0 20px var(--green);
    padding: 0 6px;
    flex-shrink: 0;
    height: 42px;
  }
  .hud-item span { display: block; font-size: 9px; color: #4a7a4a; margin-bottom: 4px; letter-spacing: 1px; }

  /* Canvas */
  .canvas-wrap {
    position: relative;
    border: 2px solid var(--green);
    box-shadow: 0 0 16px var(--green), 0 0 40px rgba(57,255,20,0.15);
    flex-shrink: 0;
  }
  canvas { display: block; }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; z-index: 10; padding: 16px;
  }
  .overlay.hidden { display: none; }

  .ov-title {
    font-size: 24px;
    text-shadow: 0 0 14px currentColor, 0 0 36px currentColor;
    animation: pulse 1s ease-in-out infinite alternate;
    letter-spacing: 3px;
  }
  @keyframes pulse { from{opacity:.6} to{opacity:1} }

  .ov-sub { font-size: 10px; color: #5aaa5a; text-align: center; line-height: 2.4; }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    padding: 14px 28px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    cursor: pointer;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 14px rgba(57,255,20,0.3);
    letter-spacing: 3px;
    touch-action: manipulation;
  }

  /* D-Pad */
  .dpad {
    position: relative;
    flex-shrink: 0;
    user-select: none;
  }

  .dpad-btn {
    position: absolute;
    background: rgba(57,255,20,0.07);
    border: 2px solid rgba(57,255,20,0.35);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: rgba(57,255,20,0.22);
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(57,255,20,0.5);
  }

  .dpad-btn svg { fill: var(--green); filter: drop-shadow(0 0 5px var(--green)); pointer-events: none; }

  .dpad-up    { border-radius: 10px 10px 0 0; }
  .dpad-down  { border-radius: 0 0 10px 10px; }
  .dpad-left  { border-radius: 10px 0 0 10px; }
  .dpad-right { border-radius: 0 10px 10px 0; }
  .dpad-center {
    background: rgba(57,255,20,0.04);
    border-color: rgba(57,255,20,0.15);
    font-size: 8px; color: #2a4a2a;
  }

  .score-pop {
    position: absolute;
    font-size: 10px; color: var(--red);
    text-shadow: 0 0 8px var(--red);
    pointer-events: none;
    animation: scorePop 0.8s forwards;
    z-index: 20; white-space: nowrap;
  }
  @keyframes scorePop {
    0%   { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-36px) scale(1.4); }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="hud-item"><span id="lbl-score">SKOR</span><span id="score">0</span></div>
  <div class="hud-item" style="text-align:center"><span id="lbl-level">SEVİYE</span><span id="level">1</span></div>
  <div class="hud-item" style="text-align:right"><span id="lbl-record">REKOR</span><span id="highscore">0</span></div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gameCanvas"></canvas>
  <div class="overlay" id="startOverlay">
    <div class="ov-title" style="color:var(--green)" id="ov-game-title">🐍 YILAN</div>
    <div class="ov-sub" id="ov-start-sub">Aşağıdaki tuşlarla yönet<br>Elmayı topla, duvara çarpma!</div>
    <button class="btn" id="startBtn">BAŞLA</button>
  </div>
  <div class="overlay hidden" id="gameOverOverlay">
    <div class="ov-title" style="color:var(--red)" id="ov-gameover-title">BİTTİ!</div>
    <div class="ov-sub" id="finalScore"></div>
    <button class="btn" id="restartBtn" style="border-color:var(--red);color:var(--red);text-shadow:0 0 8px var(--red);box-shadow:0 0 14px rgba(255,60,90,0.3)">TEKRAR</button>
  </div>
</div>

<div class="dpad" id="dpad">
  <div class="dpad-btn dpad-up"    id="btn-up">
    <svg viewBox="0 0 24 24"><polygon points="12,4 22,20 2,20"/></svg>
  </div>
  <div class="dpad-btn dpad-left"  id="btn-left">
    <svg viewBox="0 0 24 24"><polygon points="4,12 20,2 20,22"/></svg>
  </div>
  <div class="dpad-btn dpad-center" id="dpad-center">✦</div>
  <div class="dpad-btn dpad-right" id="btn-right">
    <svg viewBox="0 0 24 24"><polygon points="20,12 4,2 4,22"/></svg>
  </div>
  <div class="dpad-btn dpad-down"  id="btn-down">
    <svg viewBox="0 0 24 24"><polygon points="12,20 2,4 22,4"/></svg>
  </div>
</div>

<script>
// ─── i18n ───────────────────────────────────────────────────────────────────
const STRINGS = {
  tr: {
    pageTitle:'YILAN', gameTitle:'🐍 YILAN',
    startSub:'Aşağıdaki tuşlarla yönet\nElmayı topla, duvara çarpma!',
    startBtn:'BAŞLA', gameOverTitle:'BİTTİ!', restartBtn:'TEKRAR',
    score:'SKOR', level:'SEVİYE', record:'REKOR',
    finalScore:(s,l)=>`SKOR: ${s}  •  SEVİYE: ${l}`,
  },
  en: {
    pageTitle:'SNAKE', gameTitle:'🐍 SNAKE',
    startSub:"Use the buttons below to steer\nCollect apples, don't hit the wall!",
    startBtn:'START', gameOverTitle:'GAME OVER!', restartBtn:'RETRY',
    score:'SCORE', level:'LEVEL', record:'BEST',
    finalScore:(s,l)=>`SCORE: ${s}  •  LEVEL: ${l}`,
  }
};

const lang = new URLSearchParams(location.search).get('lang')==='en' ? 'en' : 'tr';
const T = STRINGS[lang];
document.documentElement.lang = lang;
document.title = T.pageTitle;
document.getElementById('lbl-score').textContent  = T.score;
document.getElementById('lbl-level').textContent  = T.level;
document.getElementById('lbl-record').textContent = T.record;
document.getElementById('ov-game-title').textContent = T.gameTitle;
document.getElementById('ov-start-sub').innerHTML = T.startSub.replace('\n','<br>');
document.getElementById('startBtn').textContent   = T.startBtn;
document.getElementById('ov-gameover-title').textContent = T.gameOverTitle;
document.getElementById('restartBtn').textContent = T.restartBtn;

// ─── Layout: compute sizes from viewport ───────────────────────────────────
const BTN       = Math.min(Math.floor(window.innerWidth * 0.18), 70);
const G         = 5; // gap between dpad buttons
const DPAD_TOTAL= BTN * 3 + G * 2;
const HUD_H     = 36;
const PADDING_V = 22;
const GAP       = 14; // vertical gap between elements
const canvasSize = (() => {
  const available = window.innerHeight - HUD_H - DPAD_TOTAL - PADDING_V - GAP * 2;
  const maxW      = window.innerWidth - 24;
  const raw       = Math.min(available, maxW);
  return Math.floor(raw / 20) * 20;
})();

// Apply dpad layout
const dpad = document.getElementById('dpad');
dpad.style.width  = DPAD_TOTAL + 'px';
dpad.style.height = DPAD_TOTAL + 'px';

function posBtn(el, top, left, rTL, rTR, rBR, rBL) {
  el.style.cssText += `width:${BTN}px;height:${BTN}px;top:${top}px;left:${left}px;
    border-radius:${rTL}px ${rTR}px ${rBR}px ${rBL}px;`;
  const svg = el.querySelector('svg');
  if (svg) { const s = Math.round(BTN*0.38)+'px'; svg.style.width=s; svg.style.height=s; }
}
posBtn(document.getElementById('btn-up'),    0,          BTN+G,    10,10,0,0);
posBtn(document.getElementById('btn-down'),  BTN*2+G*2,  BTN+G,    0,0,10,10);
posBtn(document.getElementById('btn-left'),  BTN+G,      0,        10,0,0,10);
posBtn(document.getElementById('btn-right'), BTN+G,      BTN*2+G*2,0,10,10,0);
const center = document.getElementById('dpad-center');
center.style.cssText += `width:${BTN}px;height:${BTN}px;top:${BTN+G}px;left:${BTN+G}px;`;

// ─── Canvas ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
canvas.width  = canvasSize;
canvas.height = canvasSize;
const TILE = 20;
const COLS = canvasSize / TILE;
const ROWS = canvasSize / TILE;

let snake, dir, nextDir, food, score, highscore, level, speed, gameLoop, running;

function init() {
  snake = [{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)},
           {x:Math.floor(COLS/2)-1,y:Math.floor(ROWS/2)},
           {x:Math.floor(COLS/2)-2,y:Math.floor(ROWS/2)}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score=0; level=1; speed=180; running=true;
  spawnFood(); updateHUD();
}

function spawnFood() {
  let p;
  do { p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p; food.pulse=0;
}

function updateHUD() {
  document.getElementById('score').textContent     = score;
  document.getElementById('level').textContent     = level;
  document.getElementById('highscore').textContent = highscore||0;
}

function step() {
  if (!running) return;
  dir = {...nextDir};
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS) return gameOver();
  if (snake.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  snake.unshift(h);
  if (h.x===food.x&&h.y===food.y) {
    score+=10*level;
    if(score>(highscore||0)){highscore=score;localStorage.setItem('snakeHS',highscore);}
    level=Math.floor(score/100)+1;
    speed=Math.max(70,180-(level-1)*12);
    spawnFood(); showScorePop(h);
    clearInterval(gameLoop); gameLoop=setInterval(step,speed);
  } else { snake.pop(); }
  updateHUD(); draw();
}

function showScorePop(pos) {
  const el = document.createElement('div');
  el.className='score-pop'; el.textContent='+' +(10*level);
  el.style.left=(pos.x*TILE+TILE/2-16)+'px';
  el.style.top=(pos.y*TILE-4)+'px';
  document.getElementById('canvasWrap').appendChild(el);
  setTimeout(()=>el.remove(),800);
}

function draw() {
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0d180d';
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++)
    ctx.fillRect(x*TILE+TILE/2-1,y*TILE+TILE/2-1,2,2);
  if(!food) return;
  food.pulse=(food.pulse+0.09)%(Math.PI*2);
  const fp=Math.sin(food.pulse)*0.2+0.8;
  const fx=food.x*TILE+TILE/2, fy=food.y*TILE+TILE/2, fr=(TILE/2-3)*fp;
  ctx.save(); ctx.shadowColor='#ff3c5a'; ctx.shadowBlur=14*fp; ctx.fillStyle='#ff3c5a';
  ctx.beginPath(); ctx.moveTo(fx,fy-fr); ctx.lineTo(fx+fr,fy); ctx.lineTo(fx,fy+fr); ctx.lineTo(fx-fr,fy);
  ctx.closePath(); ctx.fill(); ctx.restore();
  snake.forEach((seg,i)=>{
    const ratio=i/snake.length, x=seg.x*TILE, y=seg.y*TILE;
    const pad=i===0?1:2, sz=TILE-pad*2;
    if(i===0){
      ctx.save(); ctx.shadowColor='#39ff14'; ctx.shadowBlur=10;
      ctx.fillStyle='#39ff14'; ctx.fillRect(x+pad,y+pad,sz,sz); ctx.restore();
      ctx.fillStyle='#0a0a0f';
      const {x:ex,y:ey}=dir;
      if(ex===1){ctx.fillRect(x+12,y+4,3,3);ctx.fillRect(x+12,y+12,3,3);}
      else if(ex===-1){ctx.fillRect(x+4,y+4,3,3);ctx.fillRect(x+4,y+12,3,3);}
      else if(ey===-1){ctx.fillRect(x+4,y+4,3,3);ctx.fillRect(x+12,y+4,3,3);}
      else{ctx.fillRect(x+4,y+12,3,3);ctx.fillRect(x+12,y+12,3,3);}
    } else {
      const g=Math.floor(255*(1-ratio*0.7));
      ctx.fillStyle=`rgb(${Math.floor(g*.22)},${Math.floor(g*.55)},${Math.floor(g*.04)})`;
      ctx.fillRect(x+pad,y+pad,sz,sz);
    }
  });
}

function gameOver() {
  running=false; clearInterval(gameLoop);
  let f=0;
  const fl=setInterval(()=>{
    ctx.fillStyle=`rgba(255,60,90,${0.25-f*0.04})`; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(++f>5){
      clearInterval(fl);
      document.getElementById('finalScore').textContent=T.finalScore(score,level);
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }
  },80);
}

// Keyboard
document.addEventListener('keydown', e=>{
  if(!running) return;
  const m={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},
           ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
           ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},
           ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
  const nd=m[e.key];
  if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y)){nextDir=nd; e.preventDefault();}
});

// D-Pad
function addDirBtn(id,dx,dy){
  const el=document.getElementById(id);
  function on(e){e.preventDefault();if(!running)return;const nd={x:dx,y:dy};if(!(nd.x===-dir.x&&nd.y===-dir.y))nextDir=nd;el.classList.add('active');}
  function off(){el.classList.remove('active');}
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:true});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
}
addDirBtn('btn-up',0,-1); addDirBtn('btn-down',0,1);
addDirBtn('btn-left',-1,0); addDirBtn('btn-right',1,0);

// Swipe
let sw=null;
canvas.addEventListener('touchstart',e=>{sw={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!sw||!running)return;
  const dx=e.changedTouches[0].clientX-sw.x, dy=e.changedTouches[0].clientY-sw.y; sw=null;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  const nd=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(!(nd.x===-dir.x&&nd.y===-dir.y))nextDir=nd;
},{passive:true});

// Buttons
document.getElementById('startBtn').addEventListener('click',()=>{
  highscore=parseInt(localStorage.getItem('snakeHS')||'0');
  document.getElementById('startOverlay').classList.add('hidden');
  init(); draw(); gameLoop=setInterval(step,speed);
});
document.getElementById('restartBtn').addEventListener('click',()=>{
  document.getElementById('gameOverOverlay').classList.add('hidden');
  init(); draw(); gameLoop=setInterval(step,speed);
});

draw();
</script>
</body>
</html>
